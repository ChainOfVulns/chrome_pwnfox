<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>PwnFox Settings</title>
    <link rel="stylesheet" href="./settings.css">
</head>

<body>
    <div class="container">
        <h1>PwnFox Settings</h1>
        <form id="settings-form">
            <h2>Burp Proxy</h2>
            <ul class="option-list">
                <li class="option-entry">
                    <label for="burphost">Burp host</label>
                    <input type="text" id="burphost" placeholder="127.0.0.1" required>
                </li>
                <li class="option-entry">
                    <label for="burpport">Burp port</label>
                    <input type="number" id="burpport" min="1" max="65535" placeholder="8080" required>
                </li>
            </ul>
            <div class="actions">
                <button type="submit" id="save">Save</button>
                <span id="save-status" class="status"></span>
            </div>
        </form>

        <hr>

        <div class="section-header">
            <h2>Container Profiles</h2>
            <button type="button" id="clear-all">Clear All Containers</button>
        </div>
        <p class="hint">Clearing a container removes its stored cookies and rotates its isolated storage namespace across all origins.</p>
        <ul id="container-list" class="container-list"></ul>
    </div>

    <script src="../config.js"></script>
    <script src="./settings.js"></script>
</body>

</html>
